androidxTestRunner = "1.7.0"
espresso = "3.7.0"
kotlinxCoroutines = "1.8.1"
kotlinxSerializationJson = "1.7.3"
sqliteJdbc = "3.41.2.2"
jna = "5.14.0"
vico = "1.15.0"
work = "2.9.1"

[libraries]

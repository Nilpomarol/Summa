  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le>\n  *{box-sizing:border-box;}\n  body{margin:0;background:#E9E7E2;}\n  .mi{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#E9E7E2;font-family:Geist,sans-serif;color:#0B0D12;padding:64px 40px 120px;\">\n<div style=\"max-width:1120px;margin:0 auto;\">\n\n  <!-- ===== HEADER ===== -->\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:1px solid #D8D4CC;padding-bottom:34px;\">\n    <div style=\"max-width:680px;\">\n      <div style=\"font:600 11px/1 Geist;letter-spacing:.16em;text-transform:uppercase;color:#3344E0;margin-bottom:14px;\">Design system · Finance app<\u002Fdiv>\n      <div style=\"font:600 40px/1.05 Geist;letter-spacing:-.025em;\">Precise, with functional color<\u002Fdiv>\n      <div style=\"font:400 16px/1.55 Geist;color:#5C5A52;margin-top:14px;\">A neutral, calm base with tabular figures; color is reserved to communicate meaning —type, category, status and direction— never to decorate. Tokens, typography, spacing and a component library for mobile (Android) and desktop (Windows), in light and dark mode.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;font:500 12px Geist;color:#6E685E;\">\n      <span style=\"background:#fff;border:1px solid #DEDAD2;border-radius:8px;padding:6px 11px;\">Direction A · refined<\u002Fspan>\n      <span style=\"background:#fff;border:1px solid #DEDAD2;border-radius:8px;padding:6px 11px;\">v0.1<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- principis -->\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;\">\n    <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:16px 17px;\">\n      <div style=\"font:600 13px Geist;margin-bottom:5px;\">Neutral does the work<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.5 Geist;color:#6E685E;\">Cool grays and ink structure the entire interface. Density is compact and reading stays calm.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:16px 17px;\">\n      <div style=\"font:600 13px Geist;margin-bottom:5px;\">Color communicates<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.5 Geist;color:#6E685E;\">Each hue has a fixed meaning: green income, red debt, amber alert. Never color for its own sake.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:16px 17px;\">\n      <div style=\"font:600 13px Geist;margin-bottom:5px;\">Never blocks<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.5 Geist;color:#6E685E;\">Warnings are inline, dismissible banners. Indigo is reserved for action.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== 01 COLOR ===== -->\n  <div style=\"margin-top:64px;\">\n    <div style=\"font:600 11px/1 Geist;letter-spacing:.14em;text-transform:uppercase;color:#A39E94;\">01<\u002Fdiv>\n    <div style=\"font:600 26px/1.1 Geist;letter-spacing:-.02em;margin-top:8px;\">Color<\u002Fdiv>\n\n    <!-- neutrals light -->\n    <div style=\"font:600 13px Geist;color:#4A5160;margin:28px 0 12px;\">Neutrals · light mode<\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n      <sc-for list=\"{{ neutralsLight }}\" as=\"c\" hint-placeholder-count=\"10\">\n        <div style=\"width:92px;\">\n          <div style=\"height:60px;border-radius:10px;border:1px solid #E2E0DA;background: {{ c.hex }};\"><\u002Fdiv>\n          <div style=\"font:600 11px Geist;margin-top:7px;\">{{ c.n }}<\u002Fdiv>\n          <div style=\"font:500 10px 'Geist Mono';color:#9A958C;text-transform:uppercase;\">{{ c.hex }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n      <div style=\"font:500 10px 'Geist Mono';color:#9A958C;text-transform:uppercase;margin-top:9px;\">{{ c.hex }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== 02 TYPOGRAPHY ===== -->\n  <div style=\"margin-top:64px;\">\n    <div style=\"font:600 11px/1 Geist;letter-spacing:.14em;text-transform:uppercase;color:#A39E94;\">02<\u002Fdiv>\n    <div style=\"font:600 26px/1.1 Geist;letter-spacing:-.02em;margin-top:8px;\">Typography<\u002Fdiv>\n    <div style=\"font:400 14px/1.5 Geist;color:#5C5A52;margin-top:8px;max-width:620px;\">Geist for the whole interface; Geist Mono for ledger figures. Tabular numerals always, so amount columns line up.<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;\">\n      <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:22px;\">\n        <div style=\"font:600 11px Geist;color:#9A958C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;\">Geist · interface<\u002Fdiv>\n        <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid #F4F1EB;\">\n            <span style=\"width:108px;flex:none;font:500 11px 'Geist Mono';color:#9A958C;\">{{ t.meta }}<\u002Fspan>\n            <span style=\"font-family:Geist;font-weight: {{ t.w }};font-size: {{ t.size }};letter-spacing:-.01em;\">{{ t.t }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:22px;\">\n        <div style=\"font:600 11px Geist;color:#9A958C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;\">Geist Mono · tabular figures<\u002Fdiv>\n        <div style=\"font:600 34px 'Geist Mono';font-feature-settings:'tnum';letter-spacing:-.02em;\">18.420,15 €<\u002Fdiv>\n        <div style=\"margin-top:16px;font:500 15px/1.9 'Geist Mono';font-feature-settings:'tnum';color:#20242E;\">\n          <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #F4F1EB;\"><span style=\"color:#6E685E;font:500 13px Geist;\">Income<\u002Fspan><span style=\"color:#1F8F5F;\">+3.250,00<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #F4F1EB;\"><span style=\"color:#6E685E;font:500 13px Geist;\">Expenses<\u002Fspan><span>−1.986,40<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;\"><span style=\"color:#6E685E;font:500 13px Geist;\">Rent<\u002Fspan><span>−850,00<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:400 12px/1.5 Geist;color:#9A958C;margin-top:14px;\">Decimals and thousands (decimal comma, thousands dot) always align.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== 03 SPACING / RADIUS / ELEVATION ===== -->\n  <div style=\"margin-top:64px;\">\n    <div style=\"font:600 11px/1 Geist;letter-spacing:.14em;text-transform:uppercase;color:#A39E94;\">03<\u002Fdiv>\n    <div style=\"font:600 26px/1.1 Geist;letter-spacing:-.02em;margin-top:8px;\">Spacing, radius and elevation<\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:14px;margin-top:22px;\">\n      <!-- spacing -->\n      <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:20px;\">\n        <div style=\"font:600 11px Geist;color:#9A958C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;\">Spacing · base 4<\u002Fdiv>\n        <sc-for list=\"{{ spacing }}\" as=\"s\" hint-placeholder-count=\"9\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:3px 0;\">\n            <span style=\"width:34px;font:500 11px 'Geist Mono';color:#9A958C;\">{{ s.px }}<\u002Fspan>\n            <span style=\"height:12px;border-radius:3px;background:#3344E0;width: {{ s.w }};\">< /1.5 Geist;color:#9A958C;margin-top:12px;\">Width 344–480px depending on density. Header with title + close, scrollable body, footer with actions (secondary left, primary right).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- mobile sheet mini -->\n      <div style=\"background:#fff;border:1px solid #E7E3DB;border-radius:14px;padding:20px;\">\n        <div style=\"font:600 11px Geist;color:#9A958C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;\">Mobile · bottom sheet<\u002Fdiv>\n        <div style=\"border-radius:12px;overflow:hidden;position:relative;height:248px;background:#F1EFEA;border:1px solid #E7E3DB;\">\n          <div style=\"position:absolute;inset:0;background:rgba(11,13,18,.55);\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(15,18,30,.25);padding-bottom:12px;\">\n            <div style=\"display:flex;justify-content:center;padding:8px 0 4px;\"><span style=\"width:34px;height:4px;border-radius:2px;background:#D7D3CB;\"><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;padding:4px 15px 10px;\"><span style=\"font:600 14px Geist;\">New expense<\u002Fspan><span style=\"margin-left:auto;color:#9097A3;\"><span class=\"mi\" style=\"font-size:17px;\">close<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"text-align:center;padding:2px 0 10px;\"><div style=\"font:600 30px 'Geist Mono';font-feature-settings:'tnum';\">58,40 <span style=\"color:#C9CDD4;\">€<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:0 15px;\"><div style=\"height:42px;border-radius:11px;background:#3344E0;color:#fff;display:flex;align-items:center;justify-content:center;font:600 13px Geist;\">Save expense<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:400 11px/1.5 Geist;color:#9A958C;margin-top:12px;\">Full width, anchored at the bottom, handle on top. Primary action an t is lost, and the destructive button in red on the right (desktop) or on top (mobile, stacked buttons). All other modals don’t block: they can be dismissed by tapping the scrim.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== 08 DARK MODE ===== -->\n  <div style=\"margin-top:64px;\">\n    <div style=\"font:600 11px/1 Geist;letter-spacing:.14em;text-transform:uppercase;color:#A39E94;\">08<\u002Fdiv>\n    <div style=\"font:600 26px/1.1 Geist;letter-spacing:-.02em;margin-top:8px;\">Dark mode<\u002Fdiv>\n    <div style=\"font:400 14px/1.5 Geist;color:#5C5A52;margin-top:8px;max-width:660px;\">Cool, almost-black surfaces (not pure black); functional color lightens slightly to keep contrast. Shadows give way to lighter surfaces and borders.<\u002Fdiv>\n\n    <div style=\"background:#0E1014;border-radius:18px;padding:26px;margin-top:22px;color:#F2F4F8;\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n\n        <!-- dark hero + rows -->\n        <div>\n          <div style=\"background:#16181E;border:1px solid #23262E;border-radius:14px;padding:15px 16px;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;\"><span style=\"font:500 12px Geist;color:#AEB6C4;\">Net worth<\u002Fspan><span style=\"font:600 11px 'Geist Mono';color:#43C28A;background:rgba(67,194,138,.16);padding:3px 7px;border-radius:7px;\">+2,3%<\u002Fspan><\u002Fdiv>\n            <div style=\"font:600 28px 'Geist Mono';font-feature-settings:'tnum';letter-spacing:-.02em;margin-top:6px;\">18.420,15 €<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#16181E;border:1px solid #23262E;border-radius:14px;padding:6px 14px;margin-top:12px;\">\n            <sc-for list=\"{{ rows }}\" as=\"item\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #23262E;\">\n                <span style=\"width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background: {{ item.dtbg }};color: {{ item.dtint }};\"><span class=\"mi\" style=\"font-size:19px;\">{{ item.ic }}<\u002Fspan><\u002Fspan>\n                <div style=\"flex:1;min-width:0;\"><div style=\"font:600 13px Geist;\">{{ item.name }}<\u002Fdiv><div style=\"font:500 11px Geist;color:#7C8494;\">{{ item.cat }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"font:600 13px 'Geist Mono';font-feature-settings:'tnum';color: {{ item.dacol }};\">{{ item.amt }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- dark controls -->\n        <div>\n          <div style=\"display:flex;background:#1E2128;border-radius:11px;padding:3px;\">\n            <span style=\"flex:1;text-align:center;font:600 12px Geist;background:#2C303A;color:#F2F4F8;padding:7px 0;border-radius:8px;\">Month<\u002Fspan>\n            <span style=\"flex:1;text-align:center;font:500 12px Geist;color:#7C8494;padding:7px 0;\">Year<\u002Fspan>\n            <span style=\"flex:1;text-align:center;font:500 12px Geist;color:#7C8494;padding:7px 0;\">All time<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:14px;\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:11px;background:#6E7BFF;color:#0E1014;font:600 13px Geist;\"><span class=\"mi\" style=\"font-size:18px;\">add<\u002Fspan>New transaction<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:11px;background:transparent;border:1px solid #2C303A;color:#E4E6EC;font:600 13px Geist;\">Secondary<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px;\">\n            <div style=\"display:flex;align-items:center;gap:9px;background:rgba(224,169,60,.12);border:1px solid rgba(224,169,60,.3);border-radius:11px;padding:9px 11px;\"><span class=\"mi\" style=\"font-size:18px;color:#E0A93C;\">warning<\u002Fspan><span style=\"flex:1;font:500 12px Geist;color:#E8C98A;\">Groceries over budget.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;background:rgba(232,115,111,.12);border:1px solid rgba(232,115,111,.3);border-radius:11px;padding:9px 11px;\"><span class=\"mi\" style=\"font-size:18px;color:#E8736F;\">error<\u002Fspan><span style=\"flex:1;font:500 12px Geist;color:#F0A6A3;\">Device in read-only mode.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#16181E;border:1px solid #23262E;border-radius:14px;height:68px;display:flex;align-items:center;justify-content:space-around;padding:0 6px 6px;margin-top:14px;\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;color:#6E7BFF;\"><span class=\"mi\" style=\"font-size:22px;font-variation-settings:'FILL' 1;\">space_dashboard<\u002Fspan><span style=\"font:600 10px Geist;\">Home<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;color:#7C8494;\"><span class=\"mi\" style=\"font-size:22px;\">receipt_long<\u002Fspan><span style=\"font:500 10px Geist;\">Transactions<\u002Fspan><\u002Fdiv>\n            <div style=\"width:48px;height:48px;border-radius:16px;background:#6E7BFF;display:flex;align-items:center;justify-content:center;color:#0E1014;margin-top:-20px;\"><span class=\"mi\" style=\"font-size:24px;\">add<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;color:#7C8494;\"><span class=\"mi\" style=\"font-size:22px;\">monitoring<\u002Fspan><span style=\"font:500 10px Geist;\">Analysis<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;color:#7C8494;\"><span class=\"mi\" style=\"font-size:22px;\">groups<\u002Fspan><span style=\"font:500 10px Geist;\">People<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const neutralsLight = [['N0','#FFFFFF'],['N50','#F7F8FA'],['N100','#F0F1F4'],['N150','#EAECEF'],['N200','#E2E5EA'],['N300','#CDD2DA'],['N400','#A4ABB7'],['N500','#8A92A0'],['N700','#4A5160'],['N900','#0B0D12']].map(([n,hex])=>({n,hex}));\n    const neutralsDark = [['D0','#0E1014'],['D50','#16181E'],['D100','#1E2128'],['D150','#23262E'],['D200','#2C303A'],['D300','#3A3F4B'],['D400','#565E6C'],['D500','#7C8494'],['D700','#AEB6C4'],['D900','#F2F4F8']].map(([n,hex])=>({n,hex}));\n    const brand = [['Default','#3344E0'],['Hover','#2A3BCB'],['Pressed','#2230AE'],['Tint','#ECEEFD'],['Dark','#6E7BFF']].map(([n,hex])=>({n,hex}));\n\n    const semantics = [\n      { role: 'Income / Positive', use: 'Income, gains, owed to you', light: '#1F8F5F', dark: '#43C28A', sample: '+3.250,00' },\n      { role: 'Expense',          use: 'Default — ink, no hue', light: '#20242E', dark: '#F2F4F8', sample: '−34,80' },\n      { role: 'Transfer',    use: 'Movements between your own accounts', light: '#5B6B86', dark: '#8A99B5', sample: '300,00' },\n      { role: 'Settlement',       use: 'Debt payments', light: '#B9772A', dark: '#D9A152', sample: '+45,00' },\n      { role: 'Refund',           use: 'Linked returns', light: '#128A93', dark: '#3FB6BE', sample: '+29,90' },\n      { role: 'Debt / Danger',   use: 'You owe, over budget, destructive', light: '#CC4B4B', dark: '#E8736F', sample: '−62,00' },\n      { role: 'Alert',           use: 'Near the limit, warnings', light: '#C98A14', dark: '#E0A93C', sample: '94%' },\n    ];\n\n    const catsPalette = [\n      { name: 'Housing',       hex: '#C77D4A', tbg: '#F4E7DA', ic: 'home' },\n      { name: 'Groceries',     hex: '#3F9E72', tbg: '#E0F0E8', ic: 'shopping_cart' },\n      { name: 'Restaurants',     hex: '#C9554E', tbg: '#F6E2DF', ic: 'restaurant' },\n      { name: 'Transport',       hex: '#4B7DC4', tbg: '#E1EAF6', ic: 'directions_car' },\n      { name: 'Leisure',             hex: '#8A6FD1', tbg: '#EBE4F7', ic: 'sports_esports' },\n      { name: 'Subscriptions',   hex: '#2C9AA6', tbg: '#DCEFF1', ic: 'credit_card' },\n      { name: 'Uncategorized', hex: '#9097A3', tbg: '#F0F1F4', ic: 'more_horiz' },\n    ];\n\n    const typeScale = [\n      { meta: 'Display · 28/600', size: '28px', w: 600, t: 'Net worth' },\n      { meta: 'Title · 21/600',   size: '21px', w: 600, t: 'June 2025' },\n      { meta: 'Heading · 16/600', size: '16px', w: 600, t: 'Expenses by category' },\n      { meta: 'Body · 14/500',     size: '14px', w: 500, t: 'Dinner Els Pescadors' },\n      { meta: 'Body small · 13/500', size: '13px', w: 500, t: 'Restaurants · paid by you' },\n      { meta: 'Label · 12/500', size: '12px', w: 500, t: 'Checking account' },\n      { meta: 'Caption · 11/500', size: '11px', w: 500, t: 'vs May · −8,2%' },\n    ];\n\n    const spacing = [2,4,6,8,10,12,14,16,20,24,32].map(px => ({ px, w: (px * 3.5) + 'px' }));\n    const radii = [['r1','7px'],['r2','10px'],['r3','14px'],['r4','18px'],['ple','999px']].map(([n,px])=>({n,px,label:px}));\n    const elevations = [\n      { n: 'e0 · flat', css: 'none', d: '1px border' },\n      { n: 'e1', css: '0 1px 2px rgba(11,13,18,.06)', d: 'Separators' },\n      { n: 'e2', css: '0 2px 8px rgba(11,13,18,.06)', d: 'Cards' },\n      { n: 'e3', css: '0 8px 18px -6px rgba(51,68,224,.45)', d: 'Button / FAB' },\n      { n: 'e4', css: '0 24px 50px -12px rgba(15,18,30,.28)', d: 'Sheets / dialogs' },\n    ];\n\n    const icons = ['space_dashboard','receipt_long','monitoring','account_balance_wallet','groups','add','search','tune','sort','home','shopping_cart','restaurant','directions_car','sports_esports','credit_card','savings','payments','swap_horiz','handshake','assignment_return','autorenew','trending_up','calendar_month','flight','notifications','settings','warning','error','info','check_circle','north_east','south_west','edit','archive','person_add','sync'].map(g => ({ g }));\n\n    const seed = [18,42,9,0,55,31,12,70,24,8,40,15,60,33,5,48,90,22];\n    const dailyBars = seed.map((e, idx) => ({ eh: e + '%', ih: (idx === 6 ? 80 : (idx === 14 ? 22 : 0)) + '%' }));\n\n    const cats = [\n      { name: 'Housing',   amt: '850,00 €', w: '100%', cm: '#C77D4A' },\n      { name: 'Groceries', amt: '412,30 €', w: '49%',  cm: '#3F9E72' },\n      { name: 'Restaurants', amt: '268,90 €', w: '32%',  cm: '#C9554E' },\n    ];\n    const catsTop = cats;\n\n    const budgetStates = [\n      { name: 'Restaurants', spent: '268,90 €', lim: '350,00 €', w: '77%',  sc: '#1F8F5F', status: 'Within budget' },\n      { name: 'Housing',   spent: '850,00 €', lim: '900,00 €', w: '94%',  sc: '#C98A14', status: 'Near the limit' },\n      { name: 'Groceries', spent: '412,30 €', lim: '400,00 €', w: '100%', sc: '#CC4B4B', status: 'Over · +12,30 €' },\n    ];\n\n    const rows = [\n      { name: 'Payroll', cat: 'Income · Checking account', ic: 'payments', amt: '+3.250,00 €', acol: '#1F8F5F', dacol: '#43C28A', tint: '#3F9E72', tbg: '#E0F0E8', dtint: '#43C28A', dtbg: 'rgba(67,194,138,.16)', badgeIc: 'autorenew', badgeCol: '#9097A3' },\n      { name: 'Dinner Els Pescadors', cat: 'Restaurants · paid by you', ic: 'restaurant', amt: '−58,40 €', acol: '#20242E', dacol: '#F2F4F8', tint: '#C9554E', tbg: '#F6E2DF', dtint: '#E08C84', dtbg: 'rgba(224,140,132,.16)', badgeIc: 'group', badgeCol: '#8A6FD1' },\n      { name: 'To Savings', cat: 'Transfer · Checking → Savings', ic: 'swap_horiz', amt: '300,00 €', acol: '#5B6B86', dacol: '#8A99B5', tint: '#5B6B86', tbg: '#EAEDF2', dtint: '#8A99B5', dtbg: 'rgba(138,153,181,.16)', badgeIc: 'swap_horiz', badgeCol: '#5B6B86' },\n      { name: \"Laura paid you\", cat: 'Settlement · Checking account', ic: 'handshake', amt: '+45,00 €', acol: '#B9772A', dacol: '#D9A152', tint: '#B9772A', tbg: '#F7EEDD', dtint: '#D9A152', dtbg: 'rgba(217,161,82,.16)', badgeIc: '', badgeCol: '' },\n      { name: 'Zara refund', cat: 'Refund · Clothing', ic: 'assignment_return', amt: '+29,90 €', acol: '#128A93', dacol: '#3FB6BE', tint: '#128A93', tbg: '#DCEFF1', dtint: '#3FB6BE', dtbg: 'rgba(63,182,190,.16)', badgeIc: '', badgeCol: '' },\n    ];\n\n    const people = [\n      { name: 'Laura', initial: 'L', color: '#8A6FD1', sub: 'Dinner, airport taxi', amt: '96,40 €', dir: 'owes you', dcol: '#1F8F5F' },\n      { name: 'Marc',  initial: 'M', color: '#4B7DC4', sub: 'Concert tickets',      amt: '62,00 €', dir: 'you owe', dcol: '#CC4B4B' },\n      { name: 'Anna',  initial: 'A', color: '#C77D4A', sub: 'Groceries, gift',   amt: '88,10 €', dir: 'owes you', dcol: '#1F8F5F' },\n      { name: 'Pau',   initial: 'P', color: '#3F9E72', sub: 'Settled up',                 amt: '0,00 €',  dir: 'settled', dcol: '#9097A3' },\n    ];\n\n    // master/detail selected-state styling (second row selected)\n    const mdRows = rows.map((r, i) => ({\n      ...r,\n      mdbg: i === 1 ? '#F4F5FE' : 'transparent',\n      mdbd: i === 1 ? '#DADFFB' : 'transparent',\n    }));\n\n    const tableRows = [\n      { d: '30 Jun', c: 'Mercadona', a: '−34,80 €', col: '#20242E' },\n      { d: '30 Jun', c: 'Payroll',    a: '+3.250,00 €', col: '#1F8F5F' },\n      { d: '29 Jun', c: 'Spotify',   a: '−10,99 €', col: '#20242E' },\n      { d: '28 Jun', c: 'To Savings', a: '300,00 €', col: '#5B6B86' },\n    ];\n\n    const calEvents = { 12:[{c:'#2C9AA6'}], 13:[{c:'#C77D4A'},{c:'#2C9AA6'}], 15:[{c:'#1F8F5F'}], 18:[{c:'#3344E0'}] };\n    const calSample = [11,12,13,14,15,16,17,18].map(day => ({\n      day,\n      dots: calEvents[day] || [],\n      bg: day === 15 ? '#EEF0FE' : '#fff',\n      bd: day === 15 ? '#C9CFFA' : '#EAECEF',\n      numcol: day === 15 ? '#2230AE' : '#4A5160',\n    }));\n\n    return { neutralsLight, neutralsDark, brand, semantics, catsPalette, typeScale, spacing, radii, elevations, icons, dailyBars, catsTop, budgetStates, rows: mdRows, people, tableRows, calSample };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
